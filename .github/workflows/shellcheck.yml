name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ShellCheck + 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: bash -n hysteria.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
